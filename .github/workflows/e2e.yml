name: E2E UI Tests

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Install Playwright
        run: npx --yes @playwright/test@1.55.0 install --with-deps chromium

      - name: Start app
        run: npm run preview -- --host 127.0.0.1 > /tmp/sto-preview.log 2>&1 &

      - name: Wait for app
        run: curl --retry 20 --retry-delay 1 --retry-connrefused -fsS http://127.0.0.1:4173/ > /dev/null

      - name: Run browser tests
        run: npx --yes @playwright/test@1.55.0 test tests/e2e/app-smoke.spec.js --reporter=line
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sto-e2e-diagnostics
          path: |
            /tmp/sto-preview.log
            test-results/
          if-no-files-found: ignore
