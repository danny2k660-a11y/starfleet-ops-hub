name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://lxedpgfteeazbaezelge.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Verify generated web entry
        run: |
          set -euo pipefail
          test -s .output/public/index.html
          test -d .output/public/assets
          grep -q '<script' .output/public/index.html
          grep -Eq '<(div|main|body)([^>]*)>' .output/public/index.html

      - name: Create Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Verify and normalize Android web assets
        shell: bash
        run: |
          set -euo pipefail
          ENTRY="android/app/src/main/assets/public/index.html"
          test -s "$ENTRY"
          sed -i 's#\\.\\?/.output/public/assets/#./assets/#g; s#"/assets/#"./assets/#g; s#src="/assets/#src="./assets/#g; s#href="/assets/#href="./assets/#g' "$ENTRY"
          grep -q '<script' "$ENTRY"
          grep -Eq '(src|href)="\\./assets/' "$ENTRY"
          ! grep -q '\\.output/public' "$ENTRY"

      - name: Configure stable debug signing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/signing
          base64 --decode .github/android/sto-debug.keystore.b64 > android/signing/sto-debug.keystore
          cat > android/signing/keystore.properties <<'EOF'
          storeFile=signing/sto-debug.keystore
          storePassword=android
          keyAlias=androiddebugkey
          keyPassword=android
          EOF
          test -s android/signing/sto-debug.keystore
          test -s android/signing/keystore.properties

      - name: Set Android app version
        shell: bash
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          VERSION_CODE=$((1000 + RUN_NUMBER))
          VERSION_NAME="0.1.${RUN_NUMBER}"
          GRADLE="android/app/build.gradle"
          test -f "$GRADLE"
          sed -i -E "s/versionCode [0-9]+/versionCode ${VERSION_CODE}/" "$GRADLE"
          sed -i -E "s/versionName "[^"]+"/versionName "${VERSION_NAME}"/" "$GRADLE"
          python3 - <<'PY'
          from pathlib import Path
          p=Path("android/app/build.gradle")
          s=p.read_text()
          marker="android {"
          signing='''android {
              signingConfigs {
                  stableDebug {
                      storeFile file("../signing/sto-debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
          '''
          if "stableDebug" not in s:
              s=s.replace(marker, signing, 1)
              s=s.replace("buildTypes {", 'buildTypes {\n        debug { signingConfig signingConfigs.stableDebug }', 1)
              p.write_text(s)
          PY
          grep -q "versionCode ${VERSION_CODE}" "$GRADLE"
          grep -q "versionName "${VERSION_NAME}"" "$GRADLE"
          grep -q "stableDebug" "$GRADLE"
          echo "Building STO Command Center ${VERSION_NAME} (code ${VERSION_CODE})"

      - name: Build debug APK
        working-directory: android
        run: ./gradlew clean assembleDebug

      - name: Verify APK integrity and package
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/apk-badging.txt
          grep -q "package: name='com.stocommandcenter.fleetops'" /tmp/apk-badging.txt
          grep -q "sdkVersion:" /tmp/apk-badging.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sto-command-center-debug-apk-v${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
