name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://lxedpgfteeazbaezelge.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Create Android entry HTML
        shell: bash
        run: |
          set -euo pipefail
          test -d .output/public/assets
          JS="$(find .output/public/assets -maxdepth 1 -type f -name 'index-*.js' -print -quit)"
          CSS="$(find .output/public/assets -maxdepth 1 -type f -name 'styles-*.css' -print -quit)"
          test -n "$JS"
          JS="${JS#./.output/public/}"
          CSS="${CSS#./.output/public/}"
          cat > .output/public/index.html <<EOF
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
            <meta name="theme-color" content="#05070a">
            <title>STO Command Center</title>
            <link rel="stylesheet" href="./$CSS">
          </head>
          <body>
            <div id="root"></div>
            <script type="module" src="./$JS"></script>
          </body>
          </html>
          EOF
          test -s .output/public/index.html
          grep -q '<script type="module"' .output/public/index.html

      - name: Verify Android web entry
        run: test -s .output/public/index.html

      - name: Create Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sto-command-center-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
